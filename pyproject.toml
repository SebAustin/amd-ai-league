[project]
name = "amdleague"
version = "0.1.0"
description = "AMD AI League entries — Match 4: Intelligent Web Information Retrieval agent"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
gpu = ["transformers>=4.51", "accelerate>=1.0"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amdleague"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["amdleague"]
omit = ["src/amdleague/common/model_server.py", "src/amdleague/m4/render.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
